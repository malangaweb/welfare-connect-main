name: Deploy to Netlify

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Lint is currently non-blocking: the @typescript-eslint RuleCreator
      # crash (plugin/TS version mismatch) must not gate deploys. Remove
      # `|| true` once the eslint toolchain is fixed.
      - run: bun run lint || true

      - run: bun run build

      - name: Verify build output exists
        run: |
          test -f dist/index.html || { echo "dist/index.html missing — build did not produce output"; exit 1; }
          grep -q "/assets/" dist/index.html || { echo "dist/index.html does not reference built assets"; exit 1; }
          echo "Build output verified:"; ls -la dist

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: ./dist
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 5
