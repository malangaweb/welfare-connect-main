name: Deploy to GitHub Pages

# The custom domain malangawelfare.org is served by GitHub Pages. It must be
# served from the built Vite output (dist/), NOT the repo root — serving the
# root exposes /src/main.tsx, which the browser rejects (octet-stream MIME).
#
# In the repo settings, set Pages → Build and deployment → Source to
# "GitHub Actions" so this workflow's artifact is what gets published.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Ensure CNAME is present in build output
        run: |
          echo "malangawelfare.org" > dist/CNAME
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          grep -q "/assets/" dist/index.html || { echo "dist/index.html missing built asset refs"; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
